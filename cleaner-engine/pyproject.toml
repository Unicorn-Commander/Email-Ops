[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleaner-engine"
version = "0.2.1"
description = "Stateless cleaner engine microservice for Email-Ops"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.0",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.0",
  "msal>=1.30",
  "requests>=2.32",
  "pydantic>=2.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "providers*", "cleanup*", "backup*"]
