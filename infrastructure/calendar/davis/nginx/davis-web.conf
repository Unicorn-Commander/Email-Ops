server {
    listen 80 default_server;
    server_name _;

    root /var/www/davis/public;
    index index.php;
    client_max_body_size 20m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /bundles/ {
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass davis:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/davis/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/davis/public;
        fastcgi_param HTTP_PROXY "";
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
