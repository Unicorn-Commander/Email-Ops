# Append this server block to /home/deploy/james-prod/nginx-jmap-443.conf.
# Certbot standalone owns host port 80 only during issuance/renewal; do not
# run issuance concurrently with the existing renew-cert.sh job.

server {
    listen 443 ssl;
    server_name calendar.unicorncommander.ai;

    ssl_certificate /etc/letsencrypt/live/calendar.unicorncommander.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.unicorncommander.ai/privkey.pem;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /.well-known/caldav {
        return 301 /dav/;
    }

    location = /.well-known/carddav {
        return 301 /dav/;
    }

    location / {
        proxy_pass http://davis-web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_redirect off;
    }
}
