<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Perry avatar placeholder">
  <!-- PLACEHOLDER avatar (key: perry) — hue 111 = (djb2('perry') * 113) % 360. See README.md. -->
  <defs>
    <linearGradient id="bg-perry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(111, 68%, 55%)"/>
      <stop offset="100%" stop-color="hsl(153, 72%, 36%)"/>
    </linearGradient>
    <clipPath id="clip-perry"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg-perry)"/>
  <g clip-path="url(#clip-perry)">
    <text x="97" y="114" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" fill-opacity="0.18">P</text>
    <g fill="#ffffff" fill-opacity="0.95">
      <!-- horn -->
      <path d="M 66 33 L 91 12 L 74.5 40.5 Z"/>
      <!-- head + ear + neck silhouette -->
      <path d="M 68 130 L 67 92 C 67 86 70 82 76 80 C 82 78 88 78 92 74 C 96 70 97 64 95 60 C 93 56 88 50 80 45 C 74 41.5 70 37.5 66 34 L 63 33 C 60 26 58 20 56.5 15.5 C 54 21.5 51.5 27.5 50 33 C 45 36.5 42.5 42.5 42.5 50 C 42.5 58 43.5 66 43 74 L 43 130 Z"/>
    </g>
    <!-- eye -->
    <circle cx="64.5" cy="50" r="3.1" fill="#0f172a" fill-opacity="0.5"/>
  </g>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
